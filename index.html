<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vyhlášení vítězů - Kam až dojdem</title>
  <style>
    body { margin:0; font-family: system-ui, sans-serif; overflow-x: hidden; }
    
    .winner-screen {
      height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('mapa_pozadie.png');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    .podium {
      display: flex;
      align-items: flex-end;
      gap: 20px;
      margin-top: 50px;
      height: 400px;
    }

    .place {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 15px 15px 0 0;
      width: 150px;
      padding: 20px;
      animation: slideUp 1s ease-out forwards;
      opacity: 0;
      transform: translateY(100px);
    }

    /* Časovanie animácií */
    .second { height: 250px; border-color: #C0C0C0; animation-delay: 0.5s; }
    .first  { height: 350px; border-color: #FFD700; animation-delay: 1s; box-shadow: 0 0 30px rgba(255,215,0,0.3); }
    .third  { height: 200px; border-color: #CD7F32; animation-delay: 0s; }

    .crown { font-size: 40px; margin-bottom: 10px; display: block; }
    .km { font-weight: bold; font-size: 1.2rem; color: #FFD700; }

    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    h1 { font-size: 3rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); margin: 0; }
  </style>
</head>
<body>

<main class="winner-screen">
  <h1>Sláva vítězům! 🏆</h1>
  <p>Tady jsou nejlepší výkony letošních jarních prázdnin</p>

  <div class="podium">
    <div class="place second">
      <span class="crown">🥈</span>
      <h3>6.B</h3>
      <p>Cíl: Monaco</p>
      <div class="km">1376 km</div>
    </div>

    <div class="place first">
      <span class="crown">👑</span>
      <h2>7.B</h2>
      <p>Cíl: Miláno</p>
      <div class="km">1805 km</div>
    </div>

    <div class="place third">
      <span class="crown">🥉</span>
      <h3>8.A</h3>
      <p>Cíl: Tokio</p>
      <div class="km">1135 km</div>
    </div>
  </div>


</body>
</html>
